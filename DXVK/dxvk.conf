# ================================================
# DXVK Config pour Farming Simulator, par Anonymous
# ================================================
# Placer ce fichier config dans le dossier du jeu, et les Dll nécéssaires.
# https://github.com/doitsujin/dxvk/releases (dxvk-x.x.x.tar.gz)
# Tenplate Config ici : https://github.com/doitsujin/dxvk/blob/master/dxvk.conf y'a pas toutes les possibilitées (évidement), vous allez prévoir de faire vos recherches si vous voulez +.
# Dll nécéssaires : d3d11.dll, dxgi.dll, et vulkan-1.dll du pilote graphique pour NV si pas dans system32/WOW64. Pour AMD/ATI je sais pas...(surement possible).
# Nom d'utilisation recommandé : dxvk.conf / dxvk.ini
# ------------------------------------------------

# -----------------------
# DXVK HUD pour FS15 (voir détail important tuto dxvk), FS17 / FS19 / FS22 (voir détail important tuto dxvk)
# -----------------------
# Affiche FPS, frametime, VRAM utilisée, etc.
# Valeurs possibles : off / minimal / full
# Note : Peut ne pas s'afficher en plein écran exclusif ou avec certains flags DXGI voir pas du tout suivant les titres...
# dxvk.hud = full	# activer l'affichage	# full = tout le HUD (fps,frametimes,gpuload,devinfo,api,version,memory,compiler,drawcalls,pipelines,descriptors,cs,scale=1.5,opacity=0.7,submissions)
# Pour les mettre en variable windows par exemple: nom de variable : DXVK_HUD valeur : fps,frametimes,gpuload,scale=0.7
# Pour forcer DXVK à ne pas tenter des optimisations DXGI qui bloquent le HUD.
# dxgi.fullscreen = False  # pour que DXVK n'ignore pas le HUD.

# -----------------------
# Performance / OptimiZations CPU / GPU, exemple pour CPU 4core / 8thread, GPU RTX 3060ti
# -----------------------
# Certaines options avancées peuvent être ajoutées ici
# Exemple : Forcer certaines optimisations CPU / GPU
# dxvk.numAsyncThreads = 4   # Nombre de threads asynchrones pour compilation shaders max 4‑6 pour laisser le reste au jeu.
dxvk.numCompilerThreads = 4	# Définit combien de threads CPU DXVK pour compiler les shaders pour ne pas saturer et laisser un peu pour le jeu
dxvk.numAsyncThreads = 3		# Asynchrones GPU pour certaines tâches DXVK, 2‑3 est souvent optimal pour une 3060 Ti. Au-delà, risque micro-lags.
dxgi.allowTearing = True		# Permet le tearing (V‑Sync off), True pour fluidité max. Peut créer des déchirements d’image (screen tearing)
# dxgi.deferSurfaceCreation = True	# stabilité au démarrage / compatibilité, "met en pause” la fenêtre graphique tant que tout n’est pas prêt.


# -----------------------
# Hack NVAPI (NVIDIA) améliore la compatibilité avec NVIDIA
# -----------------------
# Permet de contourner certains bugs d'identification GPU sur cartes NVIDIA
# Corrige certaines détections Nvidia/AMD. Utile si le jeu ou DXVK a des comportements étranges.
# Activer en décommentant la ligne ci-dessous
# dxgi.nvapiHack = True

# -----------------------
# Graphics Pipeline Library
# -----------------------
# Améliore le rendu sur certaines cartes NVIDIA/AMD, optimisation shaders.
# Peut résoudre des freezes ou micro-stuttering
# Activer/désactiver selon ton ressenti
# dxvk.enableGraphicsPipelineLibrary = True

# -----------------------
# Logging DXVK
# -----------------------
# Active le journal des opérations DXVK
# Utile pour debug si le jeu plante ou lag
# dxvk.log = True
# Niveau de log
# dxvk.logLevel = info        # info = messages standard, debug = tout

# -----------------------
# Commentaires et Notes
# -----------------------
# - Les commentaires commencent par #
# - Pour désactiver une option, mettre # devant
# - Tu peux créer plusieurs versions de ce fichier et les renommer
# - Certaines options peuvent ne pas avoir d'effet selon le mode plein écran ou la version du jeu
